[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "meterline-anthropic"
version = "0.2.2"
description = "Reads the Anthropic Enterprise Analytics API and emits meterline records."
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Xavier Meyer" }]
keywords = ["ai", "llm", "usage", "cost", "tokens", "finops", "anthropic", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.10"
dependencies = ["meterline>=0.3.1,<0.4", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/meyerx/meterline"
Documentation = "https://github.com/meyerx/meterline/blob/main/docs/README.md"
Source = "https://github.com/meyerx/meterline/tree/main/packages/meterline-anthropic"
Issues = "https://github.com/meyerx/meterline/issues"
Changelog = "https://github.com/meyerx/meterline/blob/main/CHANGELOG.md"

[project.optional-dependencies]
parquet = ["pyarrow>=17"]
dev = ["pytest>=8", "pytest-xdist==3.8.0", "ruff==0.17.3"]
[project.scripts]
meterline-anthropic = "meterline_anthropic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

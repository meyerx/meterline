[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meterline-job"
version = "0.1.0"
description = "Runs the meterline connectors, stages silver and builds gold in one daily job, with one status line per step and an exit code per kind of failure."
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Xavier Meyer" }]
keywords = ["ai", "llm", "usage", "cost", "finops", "scheduler", "cron"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.10"
dependencies = [
    "meterline>=0.3",
    "meterline-gold[parquet]>=0.2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/meyerx/meterline"
Source = "https://github.com/meyerx/meterline/tree/main/packages/meterline-job"
Issues = "https://github.com/meyerx/meterline/issues"
Changelog = "https://github.com/meyerx/meterline/blob/main/CHANGELOG.md"

[project.optional-dependencies]
anthropic = ["meterline-anthropic>=0.2.1"]
anthropic-admin = ["meterline-anthropic-admin>=0.1.1"]
litellm = ["meterline-litellm>=0.1.1"]
copilot = ["meterline-copilot>=0.1.1"]
all = [
    "meterline-anthropic>=0.2.1",
    "meterline-anthropic-admin>=0.1.1",
    "meterline-litellm>=0.1.1",
    "meterline-copilot>=0.1.1",
]
dev = [
    "pytest>=8",
    "jsonschema>=4.18",
    "httpx>=0.27",
    "meterline-sim>=0.1",
    "meterline-anthropic>=0.2.1",
    "meterline-anthropic-admin>=0.1.1",
    "meterline-litellm>=0.1.1",
    "meterline-copilot>=0.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.17.3",
]
[project.scripts]
meterline-job = "meterline_job.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# gitleaks configuration. Both the CI secret scan and the scan of the exported public tree read this file from the
# repository root. A finding is allowed only by naming its rule and its file, never by a commit hash, so the entry
# holds in a repository with a different history.
title = "meterline"

[extend]
useDefault = true

[[allowlists]]
description = "The key-check value of the gold fixture: an HMAC of a fixed phrase under the public test key \"meterline-gold-fixture-key-not-a-secret\" (gold-core spec appendix A.1). Not a secret."
targetRules = ["generic-api-key"]
paths = [
    '''packages/meterline-gold/tests/test_done_check_G12_G14_privacy_order_manifest\.py''',
    '''docs/dev/(history/)?meterline-gold-core-SPEC-v1\.[0-9]-[0-9-]+\.md''',
]

[[allowlists]]
description = "A made-up value that tools/test_example_04_container.py planted in a Dockerfile line to show the key check catches it (the digits 0 to 9 and a to f, once or twice). It opens nothing. Allowed by its exact value, not by file, so a real key in that file is still found."
targetRules = ["generic-api-key"]
regexes = [
    '''^0123456789abcdef(0123456789abcdef)?$''',
]

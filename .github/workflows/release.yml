name: Release

# Releases ONE package when its version tag is pushed, for example `meterline-anthropic-v0.2.0`: builds the sdist
# and the wheel on a GitHub-hosted runner, attests where and how they were built, checks them in a second job, publishes
# them to PyPI through trusted publishing (no stored token), and attaches them with a CycloneDX SBOM to a GitHub release.
# It never runs on a pull request or a branch. The procedure, and the one-time PyPI setup, are in
# docs/dev/RELEASING.md, section "Publishing to PyPI".
#
# The order of the jobs is the point. `verify` reads the tag and refuses a commit that is not on main. `build` is the one
# job that holds the token to attest (id-token and attestations): after the checkout it installs the build tools from
# tools/release-constraints.txt, with hashes, builds, attests and uploads, and nothing else. `check` has neither
# permission: it compares each file's sha256 with the one that was attested before it runs twine, installs the built
# wheel or runs the SBOM tool. `publish` and `github-release` use the attested files and compare the digests again.
on:
  push:
    tags: ["meterline*-v[0-9]*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the check below needs the history of main
      - name: Refuse a tag whose commit is not on main
        # versions and the changelog change only through a pull request merged into main, so a tag that main does not
        # contain would release code that no review saw
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the commit $GITHUB_SHA is not on main"
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Read the package and the version from the tag, and check pyproject.toml says the same
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package="${TAG%-v*}"
          version="${TAG##*-v}"
          case "$package" in
            meterline|meterline-anthropic|meterline-anthropic-admin|meterline-litellm|meterline-copilot|meterline-sim|meterline-gold|meterline-job) ;;
            *) echo "::error::tag $TAG names no package of this repository"; exit 1 ;;
          esac
          declared="$(python -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "packages/$package/pyproject.toml")"
          if [ "$declared" != "$version" ]; then
            echo "::error::tag $TAG says $version, packages/$package/pyproject.toml says $declared"
            exit 1
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build and attest
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      digests: ${{ steps.build.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the build tools, with hashes, from the constraints file
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/buildenv"
          "$RUNNER_TEMP/buildenv/bin/python" -m pip install --require-hashes --only-binary=:all: -r tools/release-constraints.txt
      - name: Build the sdist and the wheel, and note their digests
        id: build
        env:
          PACKAGE: ${{ needs.verify.outputs.package }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          "$RUNNER_TEMP/buildenv/bin/python" -m build --no-isolation --outdir dist "packages/$PACKAGE"
          ls -l dist
          {
            echo "digests<<DIGESTS_END"
            (cd dist && sha256sum -- *)
            echo "DIGESTS_END"
          } >> "$GITHUB_OUTPUT"
      - name: Attest where and how the files were built (SLSA build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  check:
    name: check the files and record an SBOM
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Compare each file's sha256 with the one that was attested
        env:
          DIGESTS: ${{ needs.build.outputs.digests }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DIGESTS" > "$RUNNER_TEMP/attested.sha256"
          (cd dist && sha256sum -c "$RUNNER_TEMP/attested.sha256")
          test "$(ls dist | sort)" = "$(awk '{print $2}' "$RUNNER_TEMP/attested.sha256" | sed 's/^\*//' | sort)"
      - name: Install the check tools, with hashes, from the constraints file
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/python" -m pip install --require-hashes --only-binary=:all: -r tools/release-constraints.txt
      - name: Check the metadata PyPI will show
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tools/bin/twine" check --strict dist/*
      - name: Record a CycloneDX SBOM of the package and everything it installs
        env:
          PACKAGE: ${{ needs.verify.outputs.package }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/target"
          "$RUNNER_TEMP/target/bin/python" -m pip install dist/*.whl
          mkdir sbom
          "$RUNNER_TEMP/tools/bin/cyclonedx-py" environment --pyproject "packages/$PACKAGE/pyproject.toml" --mc-type library \
            --output-reproducible --of JSON -o "sbom/$PACKAGE-$VERSION.cdx.json" "$RUNNER_TEMP/target/bin/python"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  publish:
    name: publish to PyPI (trusted publishing)
    needs: [verify, build, check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The `pypi` environment is where the maintainer can require a manual approval before anything is uploaded.
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.verify.outputs.package }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Compare each file's sha256 with the one that was attested
        env:
          DIGESTS: ${{ needs.build.outputs.digests }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DIGESTS" > "$RUNNER_TEMP/attested.sha256"
          (cd dist && sha256sum -c "$RUNNER_TEMP/attested.sha256")
          test "$(ls dist | sort)" = "$(awk '{print $2}' "$RUNNER_TEMP/attested.sha256" | sed 's/^\*//' | sort)"
      # Trusted publishing: PyPI accepts the upload because of this workflow's short-lived OIDC identity, which the
      # maintainer registered once on PyPI. It also uploads PEP 740 attestations (on by default).
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub release with the files and the SBOM
    needs: [build, check, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom/
      - name: Compare each file's sha256 with the one that was attested
        env:
          DIGESTS: ${{ needs.build.outputs.digests }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DIGESTS" > "$RUNNER_TEMP/attested.sha256"
          (cd dist && sha256sum -c "$RUNNER_TEMP/attested.sha256")
          test "$(ls dist | sort)" = "$(awk '{print $2}' "$RUNNER_TEMP/attested.sha256" | sed 's/^\*//' | sort)"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* sbom/* --verify-tag --title "$TAG" --notes \
            "Built and published by the release workflow. What changed: CHANGELOG.md. Check a file's provenance with: gh attestation verify <file> --repo $GH_REPO"

name: Release

# Releases ONE package when its version tag is pushed, for example `meterline-anthropic-v0.2.0`: builds the sdist
# and the wheel on a GitHub-hosted runner, checks them, attests where and how they were built, publishes them to
# PyPI through trusted publishing (no stored token), and attaches them with a CycloneDX SBOM to a GitHub release.
# It never runs on a pull request or a branch. The procedure, and the one-time PyPI setup, are in
# docs/dev/RELEASING.md, section "Publishing to PyPI".
on:
  push:
    tags: ["meterline*-v[0-9]*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: build, check, SBOM, attest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the check below needs the history of main
      - name: Refuse a tag whose commit is not on main
        # versions and the changelog change only through a pull request merged into main, so a tag that main does not
        # contain would release code that no review saw
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the commit $GITHUB_SHA is not on main"
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Read the package and the version from the tag, and check pyproject.toml says the same
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package="${TAG%-v*}"
          version="${TAG##*-v}"
          case "$package" in
            meterline|meterline-anthropic|meterline-anthropic-admin|meterline-litellm|meterline-copilot|meterline-sim|meterline-gold|meterline-job) ;;
            *) echo "::error::tag $TAG names no package of this repository"; exit 1 ;;
          esac
          declared="$(python -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "packages/$package/pyproject.toml")"
          if [ "$declared" != "$version" ]; then
            echo "::error::tag $TAG says $version, packages/$package/pyproject.toml says $declared"
            exit 1
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the sdist and the wheel
        env:
          PACKAGE: ${{ steps.tag.outputs.package }}
        run: |
          set -euo pipefail
          python -m pip install "build==1.6.1" "twine==7.0.0"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build --outdir dist "packages/$PACKAGE"
          ls -l dist
          sha256sum dist/*
      - name: Check the metadata PyPI will show
        run: twine check --strict dist/*
      - name: Record a CycloneDX SBOM of the package and everything it installs
        env:
          PACKAGE: ${{ steps.tag.outputs.package }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/target"
          "$RUNNER_TEMP/target/bin/python" -m pip install dist/*.whl
          python -m pip install "cyclonedx-bom==7.4.0"
          mkdir sbom
          cyclonedx-py environment --pyproject "packages/$PACKAGE/pyproject.toml" --mc-type library \
            --output-reproducible --of JSON -o "sbom/$PACKAGE-$VERSION.cdx.json" "$RUNNER_TEMP/target/bin/python"
      - name: Attest where and how the files were built (SLSA build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  publish:
    name: publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The `pypi` environment is where the maintainer can require a manual approval before anything is uploaded.
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build.outputs.package }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Trusted publishing: PyPI accepts the upload because of this workflow's short-lived OIDC identity, which the
      # maintainer registered once on PyPI. It also uploads PEP 740 attestations (on by default).
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub release with the files and the SBOM
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* sbom/* --verify-tag --title "$TAG" --notes \
            "Built and published by the release workflow. What changed: CHANGELOG.md. Check a file's provenance with: gh attestation verify <file> --repo $GH_REPO"

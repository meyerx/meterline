name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 0"  # weekly, Sunday 03:17 UTC: the full set, so drift shows up without a push
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # the event is part of the group, so a merge's light run never replaces a pending weekly or manual full run
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: UTC
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # What runs on which event, to keep the hosted-runner minutes down:
  # - a pull request runs the light jobs (changes, lint, secrets) and, on python 3.12, the tests, the dependency audit
  #   and the dashboard check; tools/ci_suite.py, as it is on the base branch, narrows the tests from the paths the
  #   pull request changes (all of them; only the tests that read prose, for prose only; only the commit-message
  #   check, for the backlog only). minimum-versions also runs on a pull request that changes a package's
  #   pyproject.toml (it is the job that proves the declared lower bounds);
  # - a push to main (a merge) runs the light jobs and the commit-message check only: the pull request already ran
  #   the tests on that code;
  # - the container job builds and runs example 04's image on GitHub's hosted Ubuntu runner, which has Docker:
  #   on a pull request that changes examples/04-container/, packages/ or docs/integrate/, and on the weekly and manual runs;
  # - the weekly schedule and manual runs run everything: both pythons, minimum-versions, quickstart and the container job.
  changes:
    name: changes (which heavy jobs this event runs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suite: ${{ steps.diff.outputs.suite }}
      targets: ${{ steps.diff.outputs.targets }}
      minimum_versions: ${{ steps.diff.outputs.minimum_versions }}
      container: ${{ steps.diff.outputs.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the diff below needs the merge base of the pull request
      - name: Decide which tests and heavy jobs this event runs
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          targets=tools
          case "$EVENT" in
            pull_request)
              # --no-renames: a renamed file is listed under its old name too, so a document a package test reads
              # cannot leave the full suite by moving
              changed="$(git diff --name-only --no-renames "${PR_BASE}...${PR_HEAD}")"
              # the script as it is on the base branch, so a pull request cannot narrow its own tests by editing it;
              # no script on the base, a failing script or an unexpected answer all give the full suite; so do targets
              # that fail or look wrong, since the narrower suite needs the repository scans they name
              suite=full
              if git show "${PR_BASE}:tools/ci_suite.py" > "$RUNNER_TEMP/ci_suite.py" 2>/dev/null; then
                suite="$(python3 "$RUNNER_TEMP/ci_suite.py" --root . <<<"$changed" || echo full)"
                targets="$(python3 "$RUNNER_TEMP/ci_suite.py" --root . --targets)" || suite=full
              fi
              minimum=false
              if grep -Eq '^packages/[^/]+/pyproject\.toml$' <<<"$changed"; then
                minimum=true
              fi
              # the container job builds example 04's image: it runs when a path it builds from or documents changes
              container=false
              if grep -Eq '^(examples/04-container/|packages/|docs/integrate/)' <<<"$changed"; then
                container=true
              fi
              ;;
            push)
              # main after a merge: the pull request ran the tests on this code; the weekly run covers drift
              suite=none
              minimum=false
              container=false
              ;;
            *)
              suite=full
              minimum=true
              container=true
              ;;
          esac
          case "$suite" in none|tools|full) ;; *) suite=full ;; esac
          if ! [[ "$targets" =~ ^tools( [A-Za-z0-9_./:-]+)*$ ]]; then
            targets=tools
            suite=full
          fi
          echo "suite=${suite}" >> "$GITHUB_OUTPUT"
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          echo "minimum_versions=${minimum}" >> "$GITHUB_OUTPUT"
          echo "container=${container}" >> "$GITHUB_OUTPUT"
          echo "tests: ${suite} (${targets}); minimum-versions: ${minimum}; container: ${container}"

  tests:
    name: tests (python ${{ matrix.python-version }})
    # no job-level if: a skipped matrix job reports under its unexpanded name, so the required check
    # "tests (python 3.12)" would never arrive; the job always runs and its steps follow the suite
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        # python 3.10 runs on the weekly and manual runs only
        exclude: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[]' || '[{"python-version":"3.10"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # tools/test_commit_messages.py reads the commits since its baseline
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/*/pyproject.toml
      - name: Install every package (editable) with its dev and parquet extras, ruff for the lint tests, xdist for -n, build and twine for the README check
        if: needs.changes.outputs.suite != 'none'
        run: |
          python -m pip install "ruff==0.17.3" "pytest-xdist==3.8.0" "build==1.6.1" "twine==7.0.0" "pyyaml==6.0.3" "jsonschema==4.26.0" \
            -e "packages/meterline[dev,parquet]" \
            -e "packages/meterline-anthropic[dev,parquet]" \
            -e "packages/meterline-anthropic-admin[dev,parquet]" \
            -e "packages/meterline-litellm[dev,parquet]" \
            -e "packages/meterline-copilot[dev,parquet]" \
            -e "packages/meterline-sim[dev]" \
            -e "packages/meterline-gold[dev]" \
            -e "packages/meterline-job[dev]"
      - name: Run the test suite
        if: needs.changes.outputs.suite == 'full'
        run: python -m pytest -q -n 4 packages tools -p no:cacheprovider -rs
      - name: Run the tests that read prose, and the package tests that scan the whole repository (a prose-only pull request)
        if: needs.changes.outputs.suite == 'tools'
        env:
          TARGETS: ${{ needs.changes.outputs.targets }}
        run: |
          set -euo pipefail
          echo "pytest targets: ${TARGETS}"
          # shellcheck disable=SC2086  # one argument per target
          python -m pytest -q -n 4 ${TARGETS} -p no:cacheprovider -rs
      - name: Install pytest (a backlog-only pull request, or a push to main)
        if: needs.changes.outputs.suite == 'none' && hashFiles('tools/test_commit_messages.py') != ''
        run: python -m pip install "pytest>=8"
      - name: Check the commit messages (a backlog-only pull request, or a push to main)
        # the check reads the private history, so the public export leaves the file out; the step then has nothing to run
        if: needs.changes.outputs.suite == 'none' && hashFiles('tools/test_commit_messages.py') != ''
        run: python -m pytest -q tools/test_commit_messages.py -p no:cacheprovider -rs

  minimum-versions:
    # Every dependency declares a lower bound; this job proves the bounds by installing the lowest version each
    # one allows (direct dependencies only; what they pull in resolves as usual) on the lowest Python, then
    # running every test.
    name: minimum versions (python 3.10, lowest direct dependencies)
    needs: changes
    if: needs.changes.outputs.minimum_versions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Install every package with the lowest version of each declared dependency
        run: |
          python -m pip install "uv==0.12.19" "pytest-xdist==3.8.0" "build==1.6.1" "twine==7.0.0" "pyyaml==6.0.3"
          uv pip install --system --resolution lowest-direct \
            -e "packages/meterline[dev,parquet]" \
            -e "packages/meterline-anthropic[dev,parquet]" \
            -e "packages/meterline-anthropic-admin[dev,parquet]" \
            -e "packages/meterline-litellm[dev,parquet]" \
            -e "packages/meterline-copilot[dev,parquet]" \
            -e "packages/meterline-sim[dev]" \
            -e "packages/meterline-gold[dev,parquet]" \
            -e "packages/meterline-job[dev]"
          uv pip list --system
      - name: Install each built wheel (not editable) in a fresh venv with the lowest version of each dependency it declares, and import it
        # The editable install above runs the tests against this checkout, so it cannot show that a package needs a
        # newer meterline than its meterline>= bound allows. Here each package is built, installed alone from its
        # wheel with the lowest version of every dependency the wheel declares (meterline too, from the wheels built
        # here or from PyPI, whichever is the lowest the bound allows), and every module of it is imported.
        run: |
          set -euo pipefail
          for package in packages/*/pyproject.toml; do
            python -m build --wheel --outdir "$RUNNER_TEMP/wheels" "$(dirname "$package")"
          done
          for init in packages/*/src/*/__init__.py; do
            module="$(basename "$(dirname "$init")")"
            package="$(basename "$(dirname "$(dirname "$(dirname "$init")")")")"
            wheel="$(ls "$RUNNER_TEMP/wheels/${package//-/_}"-[0-9]*.whl)"
            # the wheel's own declared dependencies, named one by one so that "lowest-direct" takes the lowest of each
            reqs=()
            while IFS= read -r req; do reqs+=("$req"); done < <(unzip -p "$wheel" '*.dist-info/METADATA' | sed -n 's/^Requires-Dist: //p' | grep -v 'extra ==' || true)
            python -m venv "$RUNNER_TEMP/wheel-venvs/$package"
            uv pip install --quiet --python "$RUNNER_TEMP/wheel-venvs/$package/bin/python" --resolution lowest-direct \
              --find-links "$RUNNER_TEMP/wheels" "$wheel" ${reqs[@]+"${reqs[@]}"}
            uv pip list --python "$RUNNER_TEMP/wheel-venvs/$package/bin/python" | grep -E '^(meterline|httpx)'
            (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/wheel-venvs/$package/bin/python" -I -c "
          import importlib, pkgutil
          top = importlib.import_module('$module')
          names = [m.name for m in pkgutil.walk_packages(top.__path__, '$module.') if not m.name.endswith('.__main__')]
          for name in names:
              importlib.import_module(name)
          print('imported $module and', len(names), 'modules')")
          done
      - name: Run the test suite
        run: python -m pytest -q -n 4 packages tools -p no:cacheprovider -rs

  quickstart:
    name: quick start (the README commands, fresh venv)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      # The commands come out of README.md itself, so the README and this job cannot drift apart. The job runs on
      # the weekly and manual runs only, so it runs the whole block, the README's suite line included.
      - name: Run the README "Quick start" block (install and full suite)
        run: |
          python tools/readme_block.py "Quick start" > "$RUNNER_TEMP/quick-start.sh"
          cat "$RUNNER_TEMP/quick-start.sh"
          bash -euxo pipefail "$RUNNER_TEMP/quick-start.sh"
      - name: Run the README "Try it without a key" block (simulator, then gold)
        run: |
          python tools/readme_block.py "Try it without a key" > "$RUNNER_TEMP/try-it.sh"
          cat "$RUNNER_TEMP/try-it.sh"
          bash -euxo pipefail "$RUNNER_TEMP/try-it.sh"
          test -s gold/manifest.json
      - name: Run the "Run it" block of each example (simulated data and the connectors' fake APIs, no key)
        run: |
          .venv/bin/python -m pip install tomli
          for readme in examples/01-sim-to-kpis/README.md examples/02-exec-report/README.md examples/03-daily-job/README.md examples/05-dashboard/README.md examples/06-warehouse-duckdb/README.md examples/07-person-messages/README.md; do
            rm -rf sim-out gold exec-report.html job-data dashboard-root warehouse-demo messages-demo mail-out mail-out-refused
            python tools/readme_block.py "Run it" --readme "$readme" > "$RUNNER_TEMP/example.sh"
            cat "$RUNNER_TEMP/example.sh"
            bash -euxo pipefail "$RUNNER_TEMP/example.sh"
          done

  container:
    # Example 04: build the image, run the job on simulated data until a published gold folder exists, and check that the image
    # holds this repository's meterline versions and no key. It names GitHub's hosted Ubuntu runner on purpose, outside the
    # runner variables the other jobs use: that runner has Docker. No secret is read and no artifact is uploaded: the key used
    # here is made inside the job and is not a secret.
    name: container (example 04 image, simulated data)
    needs: changes
    if: needs.changes.outputs.container == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image from the repository root
        run: docker build -f examples/04-container/Dockerfile -t meterline-job:local .
      - name: Check that the image holds this repository's version of every meterline package
        run: docker run --rm --entrypoint pip meterline-job:local list --format=json | python3 tools/check_image_versions.py
      - name: Make a throwaway key for the run (it is not a secret)
        # written to the job's environment file and never echoed; the checks below look for it in everything the image shows
        run: echo "METERLINE_GOLD_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Run the "Run it" block of examples/04-container/README.md (the three steps on simulated data)
        # no -x: a trace would echo the key into the log that the next steps search
        run: |
          set -euo pipefail
          python3 tools/readme_block.py "Run it" --readme examples/04-container/README.md > "$RUNNER_TEMP/container.sh"
          bash -eo pipefail "$RUNNER_TEMP/container.sh" 2>&1 | tee "$RUNNER_TEMP/container.log"
      - name: Run the "Run it in the container" block of examples/05-dashboard/README.md (the dashboard on example 04's gold volume)
        # its exit code counts: the block lists the manager keys and renders one manager's folder with --check; the server block is not run
        run: |
          set -euo pipefail
          python3 tools/readme_block.py "Run it in the container" --readme examples/05-dashboard/README.md > "$RUNNER_TEMP/dashboard.sh"
          bash -eo pipefail "$RUNNER_TEMP/dashboard.sh"
      - name: Run the "Run it in the container" block of examples/06-warehouse-duckdb/README.md (the DuckDB files, on example 04's gold volume)
        # its exit code counts: the block loads the warehouse files into a volume of their own and checks them
        run: |
          set -euo pipefail
          python3 tools/readme_block.py "Run it in the container" --readme examples/06-warehouse-duckdb/README.md > "$RUNNER_TEMP/warehouse.sh"
          bash -eo pipefail "$RUNNER_TEMP/warehouse.sh"
      - name: Run the "Run it in the container" block of examples/07-person-messages/README.md (the messages, on example 04's gold volume)
        # its exit code counts: the block writes the .eml files into a volume of their own and never passes --send
        run: |
          set -euo pipefail
          python3 tools/readme_block.py "Run it in the container" --readme examples/07-person-messages/README.md > "$RUNNER_TEMP/messages.sh"
          bash -eo pipefail "$RUNNER_TEMP/messages.sh"
      - name: Force a failed run (a missing configuration) and keep its log
        run: |
          docker volume create meterline-empty >/dev/null
          if docker run --rm -e METERLINE_GOLD_KEY -v meterline-empty:/config meterline-job:local run /config/job.toml > "$RUNNER_TEMP/failed.log" 2>&1; then
            echo "the forced failed run exited 0" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/failed.log"
      - name: The throwaway key is in no layer, no image setting and no log, on the success and on the failed run
        run: |
          docker history --no-trunc meterline-job:local > "$RUNNER_TEMP/history.txt"
          docker image inspect meterline-job:local > "$RUNNER_TEMP/inspect.json"
          python3 tools/check_image_key.py METERLINE_GOLD_KEY "$RUNNER_TEMP/history.txt" "$RUNNER_TEMP/inspect.json" \
            "$RUNNER_TEMP/container.log" "$RUNNER_TEMP/failed.log"
      - name: Run the "Clean up" block of examples/04-container/README.md (remove the volumes)
        run: |
          set -euo pipefail
          python3 tools/readme_block.py "Clean up" --readme examples/04-container/README.md > "$RUNNER_TEMP/clean-up.sh"
          bash -eo pipefail "$RUNNER_TEMP/clean-up.sh"

  audit:
    name: dependency audit (pip-audit)
    needs: changes
    if: needs.changes.outputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install every package with all its extras, and pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-audit==2.10.1" \
            -e "packages/meterline[dev,parquet]" \
            -e "packages/meterline-anthropic[dev,parquet]" \
            -e "packages/meterline-anthropic-admin[dev,parquet]" \
            -e "packages/meterline-litellm[dev,parquet]" \
            -e "packages/meterline-copilot[dev,parquet]" \
            -e "packages/meterline-sim[dev]" \
            -e "packages/meterline-gold[dev,parquet]" \
            -e "packages/meterline-job[dev]"
      - name: Look up every installed dependency in the vulnerability databases
        # the packages themselves are installed editable from this checkout and are skipped
        run: python -m pip_audit --skip-editable --progress-spinner off

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff==0.17.3"
      - name: Lint the package sources with the committed configuration (ruff.toml)
        run: ruff check packages/*/src
      - name: Check the whole tree for syntax errors and undefined names
        # E9 syntax/IO errors, F63 invalid comparisons, F7 misplaced statements, F82 undefined names.
        run: ruff check --isolated --select E9,F63,F7,F82 .

  dashboard-a11y:
    # F-43: axe-core on every tab of every audience page of the fixture build, both schemes; fails on a
    # critical or serious violation, or on a CSP violation.
    name: dashboard accessibility (axe-core 4.10)
    needs: changes
    if: needs.changes.outputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install meterline and gold
        run: python -m pip install -e packages/meterline -e packages/meterline-gold
      - name: Build the fixture gold folder
        run: >-
          METERLINE_GOLD_KEY="$(python -c 'print("x" * 32)')"
          meterline-gold build --silver docs/gold-fixture/input/silver --org-files docs/gold-fixture/input/org
          --policy docs/gold-fixture/input/policy.yaml --prices docs/gold-fixture/input/prices.yaml
          --invoice docs/gold-fixture/input/invoice.csv --out "$RUNNER_TEMP/gold"
      # under Node 26, Puppeteer's Chrome unzip stops early and still exits 0, leaving a broken browser; pin an LTS Node
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install axe-core and Puppeteer, pinned
        working-directory: ${{ runner.temp }}
        # newer npm does not run Puppeteer's install script, so fetch the Chrome build it pins explicitly
        run: |
          npm install --no-save --no-audit --no-fund axe-core@4.10.3 puppeteer@23.11.1
          npx --no-install puppeteer browsers install chrome
      - name: Install chrome-headless-shell, the build Puppeteer pins
        working-directory: ${{ runner.temp }}
        # tools/dashboard_axe.js launches headless: "shell"; with no version given, Puppeteer's CLI installs the
        # chrome-headless-shell build puppeteer@23.11.1 pins (131.0.6778.204), the one launch looks for
        run: npx --no-install puppeteer browsers install chrome-headless-shell
      - name: Run axe on the dashboard
        env:
          NODE_PATH: ${{ runner.temp }}/node_modules
        run: node tools/dashboard_axe.js "$RUNNER_TEMP/gold" packages/meterline-gold/src/meterline_gold/dashboard/index.html

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned release, checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
        run: |
          set -euo pipefail
          # one pinned checksum per platform, from the gitleaks ${GITLEAKS_VERSION} checksums file
          case "${RUNNER_OS_NAME}-${RUNNER_ARCH_NAME}" in
            Linux-X64)  platform="linux_x64";  sha="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" ;;
            macOS-X64)  platform="darwin_x64"; sha="dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709" ;;
            macOS-ARM64) platform="darwin_arm64"; sha="b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5" ;;
            *) echo "No pinned gitleaks build for ${RUNNER_OS_NAME}-${RUNNER_ARCH_NAME}" >&2; exit 1 ;;
          esac
          f="gitleaks_${GITLEAKS_VERSION}_${platform}.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${sha}  ${f}" | shasum -a 256 -c -
          tar -xzf "$f" gitleaks
          ./gitleaks version
      - name: Scan the commits this event adds (whole history on manual runs)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ "$EVENT" = "push" ] && [ -n "${PUSH_BEFORE//0/}" ]; then
            # a push to a new branch has an all-zero "before"; that case falls through to a full scan
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          fi
          if [ -n "$range" ]; then
            echo "Scanning commits ${range}"
            ./gitleaks git --redact --no-banner --verbose --log-opts="${range}" .
          else
            echo "Scanning the full history"
            ./gitleaks git --redact --no-banner --verbose .
          fi
